
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - rm -rf node_modules .svelte-kit build
        - npm ci
    build:
      commands:
        - echo "MY_ACCESS_KEY_ID=$MY_ACCESS_KEY_ID" >> .env
        - echo "MY_SECRET_ACCESS_KEY=$MY_SECRET_ACCESS_KEY" >> .env
        - echo "BEDROCK_KB_ID=$BEDROCK_KB_ID" >> .env
        - npm run build
        - echo "=== Injecting env vars into compute runtime ==="
        - cp .env build/compute/default/.env 2>/dev/null || true
        - echo "=== Creating env loader ==="
        - |
          cat > build/compute/default/load-env.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const envPath = path.join(__dirname, '.env');
          if (fs.existsSync(envPath)) {
            const lines = fs.readFileSync(envPath, 'utf8').split('\n');
            for (const line of lines) {
              const [key, ...vals] = line.split('=');
              if (key && vals.length > 0) {
                process.env[key.trim()] = vals.join('=').trim();
              }
            }
            console.log('ENV LOADED from .env file');
          }
          EOF
        - echo "=== Patching server entry point ==="
        - |
          if [ -f build/compute/default/index.mjs ]; then
            sed -i '1s/^/import ".\/load-env.js";\n/' build/compute/default/index.mjs
          elif [ -f build/compute/default/index.js ]; then
            sed -i '1s/^/require(".\/load-env.js");\n/' build/compute/default/index.js
          fi
        - echo "=== Verifying ==="
        - ls -la build/compute/default/.env
        - ls -la build/compute/default/load-env.js
        - head -3 build/compute/default/index.* 2>/dev/null || true
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*

