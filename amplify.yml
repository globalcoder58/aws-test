version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
        - echo "=== DEBUG - Looking for deploy-manifest.json ==="
        - find. -name "deploy-manifest.json" -not -path "*/node_modules/*" || echo "NOT FOUND ANYWHERE"
        - echo "=== DEBUG - .amplify-hosting contents ==="
        - ls -la .amplify-hosting/ || echo ".amplify-hosting directory NOT FOUND"
        - echo "=== DEBUG - build directory contents ==="
        - ls -la build/ || echo "build directory NOT FOUND"
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
