
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - rm -rf node_modules .svelte-kit build .amplify-hosting
        - npm ci
    build:
      commands:
        - npm run build
        - echo "=== Verifying build output ==="
        - ls -la build/
        - cat build/deploy-manifest.json
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*

